<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Budget">
<meta name="theme-color" content="#ffffff">
<title>Budget — maquette</title>
<style>
  :root{
    --ink:#111; --ink2:#555; --ink3:#999; --line:#ddd; --bg:#fff; --panel:#f6f6f4;
    --accent:#1f5fbf; --warn:#c0392b;
    --r:12px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
    -webkit-text-size-adjust:100%;}
  body{padding:calc(env(safe-area-inset-top) + 12px) calc(env(safe-area-inset-right) + 16px)
        calc(env(safe-area-inset-bottom) + 16px) calc(env(safe-area-inset-left) + 16px);}
  .num{font-variant-numeric:tabular-nums}

  header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
  header .maj{font-size:13px;color:var(--ink2)}
  header .tag{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
    color:var(--warn);border:1px solid var(--warn);border-radius:6px;padding:2px 6px;margin-left:8px}
  button{font:inherit;font-size:14px;font-weight:600;color:var(--ink);background:var(--panel);
    border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer}
  button:active{background:#e9e9e6}

  .grid{display:grid;gap:14px;grid-template-columns:1fr}
  @media (min-width:900px){ .grid{grid-template-columns:1.15fr 1fr} }

  .card{background:var(--panel);border-radius:var(--r);padding:14px 16px}
  .card h2{margin:0 0 8px;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}

  .big{font-size:34px;font-weight:700;line-height:1.1}
  .sub{font-size:14px;color:var(--ink2);margin-top:4px}
  .sub b{color:var(--ink)}

  svg text{font-family:inherit}
  .chart{width:100%;height:auto;display:block;margin-top:8px}

  .row{margin-top:12px}
  .row .lbl{display:flex;justify-content:space-between;gap:8px;font-size:14px;margin-bottom:5px}
  .row .lbl span:last-child{color:var(--ink2)}
  .bar{height:12px;background:#e4e4e0;border-radius:6px;overflow:hidden;position:relative}
  .bar > i{display:block;height:100%;background:var(--ink);border-radius:6px}
  .bar.over > i{background:var(--warn)}
  .hint{font-size:12px;color:var(--ink3);margin-top:3px}

  .pockets{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin-top:10px}
  .pocket{background:var(--bg);border-radius:10px;padding:10px 12px}
  .pocket .n{font-size:13px;color:var(--ink2)}
  .pocket .v{font-size:20px;font-weight:700;margin-top:2px}
  .pocket .c{font-size:12px;color:var(--ink3);margin-top:2px}
  .pocket.wide{grid-column:1 / -1;display:grid;grid-template-columns:1fr 1.3fr;gap:12px;align-items:center}
  .spark{width:100%;height:auto;display:block}

  .tagmini{font-size:10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--warn);
    border:1px solid var(--warn);border-radius:5px;padding:1px 5px;margin-left:6px;vertical-align:2px}
  .hbtns{display:flex;gap:8px}
  .status{font-size:13px;color:var(--warn);margin:-4px 0 10px}
  .status:empty{display:none}
  #settings{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:flex-start;justify-content:center;
    padding:calc(env(safe-area-inset-top) + 16px) 12px 16px;overflow:auto;z-index:10}
  #settings.open{display:flex}
  .sheet{background:var(--bg);border-radius:16px;max-width:640px;width:100%;padding:18px}
  .sheet h3{margin:0 0 12px;font-size:18px}
  .sheet label{font-size:14px;color:var(--ink2);display:block;margin:10px 0 4px}
  .ed{border-top:1px solid var(--line);margin-top:14px;padding-top:6px}
  .ed h4{margin:8px 0 4px;font-size:15px}
  .item{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:6px 10px;background:var(--panel);border-radius:10px;padding:8px 10px;margin-top:8px;align-items:end}
  .item label{margin:0;font-size:12px}
  .item input,.item select{width:100%;font-size:16px;padding:7px;border:1px solid var(--line);border-radius:8px;background:#fff}
  .item input[type=checkbox]{width:22px;height:22px}
  .item .del{justify-self:start}
  .sheet input[type=password]{width:100%;font-size:16px;padding:10px;border:1px solid var(--line);border-radius:10px}
  .acc{display:grid;grid-template-columns:1fr auto auto auto;gap:6px 14px;align-items:center;font-size:14px;margin-top:8px}
  .acc .h{font-size:12px;color:var(--ink3)}
  .acc input{width:22px;height:22px}
  .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .muted{font-size:12px;color:var(--ink3);margin-top:8px}
</style>
</head>
<body>
<header>
  <div><span class="maj num" id="maj"></span><span class="tag" id="fakeTag">Données fictives</span></div>
  <div class="hbtns"><button id="refresh">Actualiser</button><button id="openSettings" aria-label="Réglages">Réglages</button></div>
</header>
<div class="status" id="status"></div>

<div class="grid">
  <div style="display:grid;gap:14px;align-content:start">
    <section class="card" id="richesse"></section>
    <section class="card" id="depenses"></section>
  </div>
  <div style="display:grid;gap:14px;align-content:start">
    <section class="card" id="objectifs"></section>
    <section class="card" id="epargne"></section>
  </div>
</div>

<div id="settings" role="dialog" aria-modal="true">
  <div class="sheet">
    <h3>Réglages</h3>
    <label for="token">Jeton d'API Wallet (Paramètres → REST API, dans la version web)</label>
    <input type="password" id="token" autocomplete="off" placeholder="Colle ton jeton ici">
    <label for="relais">Adresse du relais (si Wallet bloque l'accès direct)</label>
    <input type="url" id="relais" autocomplete="off" placeholder="https://….workers.dev" style="width:100%;font-size:16px;padding:10px;border:1px solid var(--line);border-radius:10px">
    <div class="acts">
      <button id="saveToken">Enregistrer et synchroniser</button>
    </div>
    <div id="accList"></div>
    <div id="editors"></div>
    <div class="ed"><h4>Copier vers un autre appareil</h4>
      <p class="muted" style="margin-top:0">Copie les comptes, cartes, prêts, poches et l'adresse du relais (sans le jeton). Sur l'autre appareil, colle le texte ci-dessous puis Importer.</p>
      <div class="acts" style="margin-top:6px"><button id="copyCfg">Copier les réglages</button></div>
      <textarea id="cfgText" rows="3" style="width:100%;font-size:16px;margin-top:8px;padding:8px;border:1px solid var(--line);border-radius:10px" placeholder="Colle ici les réglages copiés"></textarea>
      <div class="acts" style="margin-top:6px"><button id="importCfg">Importer</button></div>
    </div>
    <div class="acts">
      <button id="closeSettings">Fermer</button>
      <button id="fullSync">Resynchroniser tout</button>
      <button id="wipe">Effacer jeton et données</button>
    </div>
    <p class="muted">Le jeton et les opérations restent uniquement sur cet appareil.</p>
  </div>
</div>

<script>
/* ------------------------------------------------------------------
   DONNÉES FICTIVES — seront remplacées par l'API Wallet (étape 2)
   ------------------------------------------------------------------ */
function fakeData(){
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth(), d = now.getDate();

  const comptes = [
    {nom:"Compte courant LCL", banque:"LCL", solde:1840,  mobilisable:true},
    {nom:"Compte courant SG",  banque:"SG",  solde:960,   mobilisable:true},
    {nom:"Livret A",           banque:"LCL", solde:4200,  mobilisable:true},
    {nom:"LDD",                banque:"SG",  solde:1650,  mobilisable:true},
    {nom:"Yomoni",             banque:"Yomoni", solde:2603, mobilisable:false},
    {nom:"Nalo",              banque:"Nalo",  solde:1300, mobilisable:false},
  ];
  const total = comptes.reduce((s,c)=>s+c.solde,0);

  // Historique richesse : fin de chaque mois écoulé + chaque jour du mois en cours
  const mois = [];
  let v = total - 2600;
  for(let i=0;i<m;i++){ v += 180 + Math.round(Math.sin(i*1.7)*350); mois.push({i, v}); }
  const jours = [];
  let w = mois.length ? mois[mois.length-1].v : total - 400;
  const step = (total - w) / Math.max(d,1);
  for(let j=1;j<=d;j++){
    w += step + Math.round(Math.sin(j*1.3)*160) - (j===5?900:0) + (j===28?1200:0);
    jours.push({j, v: Math.round(w)});
  }
  // recale la courbe pour finir exactement sur le total du jour
  const ecart = total - jours[jours.length-1].v;
  jours.forEach(p=>{ p.v = Math.round(p.v + ecart * p.j / d); });

  const cartes = [
    {nom:"Carte papa",  compte:"Compte courant LCL", depense:812, budget:1100},
    {nom:"Carte maman", compte:"Compte courant SG",  depense:540, budget:900},
  ];

  const prets = [
    {nom:"Prêt maison",  rembourse:58300, total:142000, fin:"2033-08-01"},
    {nom:"Prêt voiture", rembourse:9650,  total:18000,  fin:"2028-03-05"},
  ];

  const hist = (base, inc, n=12) => Array.from({length:n},(_,k)=>Math.round(base + inc*k + Math.sin(k)*inc*0.6));
  const poches = {
    precaution:{nom:"Épargne de précaution", compte:"Livret A", solde:4200, cible:6300, historique:hist(2400,165)},
    retraite:{nom:"Poche retraite", compte:"Yomoni", solde:2603, objectif:150000, echeance:2060, historique:hist(1100,135)},
    autres:[
      {nom:"Poche travaux",  compte:"LDD",  solde:950},
      {nom:"Poche voiture",  compte:"LDD",  solde:700},
      {nom:"Poche vacances", compte:"Compte courant SG", solde:620},
      {nom:"Poche loisirs",  compte:"Compte courant LCL", solde:310},
      {nom:"Poche Clément",  compte:"Nalo", solde:650},
      {nom:"Poche Juliette", compte:"Nalo", solde:650},
    ]
  };

  return {maj:now, comptes, total, mois, jours, cartes, prets, poches};
}

/* ------------------------------------------------------------------ */
const eur = n => new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(n);
const pct = (a,b) => b ? Math.round(a/b*100) : 0;
const MOIS = ['Janv.','Févr.','Mars','Avr.','Mai','Juin','Juil.','Août','Sept.','Oct.','Nov.','Déc.'];
const MOIS_LONG = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const dateLongue = iso => { const t=new Date(iso); return (t.getDate()===1?'1er':t.getDate())+' '+MOIS_LONG[t.getMonth()]+' '+t.getFullYear(); };

function bar(val, max){
  const p = pct(val,max);
  return `<div class="bar ${p>100?'over':''}"><i style="width:${Math.min(p,100)}%"></i></div>`;
}

/* Graphe richesse : mois écoulés | jours du mois en cours */
function richesseChart(D){
  const W=640,H=210,padL=8,padR=8,padT=14,padB=28;
  const now=D.maj, m=now.getMonth();
  const daysInMonth=new Date(now.getFullYear(),m+1,0).getDate();
  const all=[...D.mois.map(x=>x.v),...D.jours.map(x=>x.v)];
  const mn=Math.min(...all), mx=Math.max(...all), pad=(mx-mn)*0.08||Math.abs(mx)*0.05||1, lo=mn-pad, hi=mx+pad;
  const Y=v=>padT+(H-padT-padB)*(1-(v-lo)/(hi-lo));
  const split = D.mois.length ? padL+(W-padL-padR)*0.5 : padL;
  const xm = i => padL + (split-padL) * ((i+0.5)/Math.max(D.mois.length,1));
  const xd = j => split + (W-padR-split) * ((j-0.5)/daysInMonth);

  const pts=[...D.mois.map(p=>[xm(p.i),Y(p.v)]),...D.jours.map(p=>[xd(p.j),Y(p.v)])];
  const path=pts.map((p,k)=>(k?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');

  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Évolution de la richesse totale">`;
  s+=`<line x1="${padL}" x2="${W-padR}" y1="${H-padB}" y2="${H-padB}" stroke="#ccc"/>`;
  if(D.mois.length) s+=`<line x1="${split}" x2="${split}" y1="${padT-6}" y2="${H-padB+4}" stroke="#999" stroke-dasharray="3 3"/>`;
  D.mois.forEach(p=>{ s+=`<text x="${xm(p.i)}" y="${H-10}" font-size="11" fill="#777" text-anchor="middle">${MOIS[p.i]}</text>`; });
  [1,10,20,daysInMonth].forEach(j=>{ s+=`<text x="${xd(j)}" y="${H-10}" font-size="11" fill="#777" text-anchor="middle">${j}</text>`; });
  s+=`<text x="${(split+W-padR)/2}" y="${padT-2}" font-size="11" fill="#777" text-anchor="middle">${MOIS_LONG[m]} par jour</text>`;
  s+=`<path d="${path}" fill="none" stroke="#111" stroke-width="2" stroke-linejoin="round"/>`;
  D.mois.forEach(p=>{ s+=`<circle cx="${xm(p.i)}" cy="${Y(p.v)}" r="3" fill="#111"/>`; });
  const last=pts[pts.length-1];
  s+=`<circle cx="${last[0]}" cy="${last[1]}" r="4.5" fill="var(--accent)"/>`;
  s+=`</svg>`;
  return s;
}

function spark(values){
  const W=220,H=60,p=4, lo=Math.min(...values), hi=Math.max(...values);
  const X=k=>p+(W-2*p)*k/(values.length-1), Y=v=>p+(H-2*p)*(1-(v-lo)/((hi-lo)||1));
  const line=values.map((v,k)=>(k?'L':'M')+X(k).toFixed(1)+' '+Y(v).toFixed(1)).join(' ');
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" aria-hidden="true">
    <path d="${line} L${X(values.length-1)} ${H-p} L${X(0)} ${H-p} Z" fill="#e4e4e0"/>
    <path d="${line}" fill="none" stroke="#111" stroke-width="1.8"/>
    <circle cx="${X(values.length-1)}" cy="${Y(values[values.length-1])}" r="3.5" fill="var(--accent)"/>
    <text x="${p}" y="10" font-size="9" fill="#999">12 mois</text></svg>`;
}

/* ------------------------------------------------------------------
   STOCKAGE LOCAL (cet appareil uniquement)
   ------------------------------------------------------------------ */
const K_CFG='budget.cfg', K_CACHE='budget.cache';
const load=(k,def)=>{ try{ return JSON.parse(localStorage.getItem(k)) ?? def; }catch(e){ return def; } };
const save=(k,v)=>{ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } };
let CFG = load(K_CFG, {token:'', accounts:{}});
let CACHE = load(K_CACHE, null); // {accounts:[], records:{id:[accountId, 'YYYY-MM-DD', montant, type, transfert]}, lastSync, lastFull}

const esc = t => String(t ?? '').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const setStatus = t => { document.getElementById('status').textContent = t || ''; };

/* ------------------------------------------------------------------
   API WALLET
   ------------------------------------------------------------------ */
const API_DIRECT='https://rest.budgetbakers.com/wallet';
const apiBase = () => ((CFG.relais||'').trim().replace(/\/+$/,'') || API_DIRECT) + '/v1/api';

async function apiGet(path, params){
  const qs=new URLSearchParams();
  Object.entries(params||{}).forEach(([k,v])=>[].concat(v).forEach(x=>qs.append(k,x)));
  let r;
  try{
    r = await fetch(`${apiBase()}${path}?${qs}`, {headers:{Authorization:'Bearer '+CFG.token, Accept:'application/json'}});
  }catch(e){
    throw new Error("Le navigateur a bloqué l'appel à Wallet (probablement une restriction CORS) : il faudra passer par un petit relais.");
  }
  if(r.status===401) throw new Error('Jeton refusé par Wallet : vérifie-le dans les réglages.');
  if(r.status===403) throw new Error("Accès refusé : l'API Wallet nécessite un abonnement Premium.");
  if(r.status===409) throw new Error('Wallet est en cours de synchronisation : réessaie dans quelques minutes.');
  if(r.status===429) throw new Error("Limite de requêtes Wallet atteinte : réessaie dans un moment.");
  if(!r.ok) throw new Error('Erreur Wallet (HTTP '+r.status+').');
  return r.json();
}

async function fetchAll(path, key, params){
  const out=[]; let offset=0;
  for(let n=0;n<100;n++){
    const body = await apiGet(path, {...params, limit:200, offset});
    out.push(...(body[key]||[]));
    if(body.nextOffset==null) break;
    offset = body.nextOffset;
  }
  return out;
}

/* Synchronisation : complète une fois par jour (ou sur demande), sinon uniquement les opérations modifiées */
// Lit un montant sous forme de nombre, de texte ou d'objet {value}
const montant = v => { if(v==null) return null; if(typeof v==='object') v = v.value ?? v.amount;
  const n = typeof v==='string' ? parseFloat(v.replace(',','.')) : v; return Number.isFinite(n) ? n : null; };

async function sync(forceFull){
  if(!CFG.token) return false;
  const now=new Date(), today=now.toISOString().slice(0,10);
  const full = forceFull || !CACHE || CACHE.v !== 2 || CACHE.lastFull !== today;
  const accounts = await fetchAll('/accounts','accounts',{});
  const params = {recordDate:'gte.1990-01-01'}; // annule la fenêtre par défaut de 3 mois
  if(!full) params.updatedAt = 'gte.'+CACHE.lastSync;
  const recs = await fetchAll('/records','records',params);
  const records = full ? {} : CACHE.records;
  recs.forEach(r=>{
    if(r.recordState==='void'){ delete records[r.id]; return; }
    records[r.id]=[r.accountId, String(r.recordDate).slice(0,10), Number(r.amount?.value)||0, r.recordType, r.transferId?1:0,
      [r.payee, r.payer, r.note, r.counterParty].filter(Boolean).join(' ').toLowerCase()];
  });
  CACHE = {v:2, accounts: accounts.map(a=>({id:a.id, name:a.name, type:a.accountType, archived:a.archived,
            exclude:a.excludeFromStats, initial: montant(a.initialBalance) ?? 0,
            balance: montant(a.balance) ?? montant(a.currentBalance) ?? montant(a.actualBalance) ?? null})),
           records, lastSync: now.toISOString(), lastFull: full ? today : CACHE.lastFull};
  if(!save(K_CACHE, CACHE)) setStatus("Mémoire de l'appareil pleine : les données ne sont pas conservées entre deux ouvertures.");
  return true;
}

/* Réglage par compte, avec valeurs par défaut */
function accCfg(a){
  const c = CFG.accounts[a.id] || {};
  return {
    inclus: c.inclus ?? (!a.archived && !a.exclude),
    mobilisable: c.mobilisable ?? (a.type==='CurrentAccount' || a.type==='SavingAccount'),
  };
}

/* Modèle réel (richesse) à partir du cache */
function soldeActuel(a){
  return a.balance ?? Object.values(CACHE.records).reduce((s,r)=> r[0]===a.id ? s+r[2] : s, a.initial);
}

function realModel(){
  const now=new Date(), y=now.getFullYear(), m=now.getMonth(), d=now.getDate();
  const accs = CACHE.accounts.filter(a=>accCfg(a).inclus);
  const ids = new Set(accs.map(a=>a.id));
  const recs = Object.values(CACHE.records).filter(r=>ids.has(r[0]));
  const iso = (yy,mm,dd)=> new Date(Date.UTC(yy,mm,dd)).toISOString().slice(0,10);
  // Solde à une date = solde actuel − opérations postérieures (ancré sur le solde Wallet quand il existe)
  const allRecs = Object.values(CACHE.records);
  const balAt = (accId, date) => {
    const a = CACHE.accounts.find(x=>x.id===accId); if(!a) return 0;
    return soldeActuel(a) - allRecs.reduce((s,r)=> r[0]===accId && r[1]>date ? s+r[2] : s, 0);
  };
  const comptes = accs.map(a=>({nom:a.name, solde: soldeActuel(a), mobilisable: accCfg(a).mobilisable}));
  const totalAt = date => accs.reduce((s,a)=>s+balAt(a.id,date),0);
  const mois=[]; for(let i=0;i<m;i++) mois.push({i, v: totalAt(iso(y,i+1,0))});
  const jours=[]; for(let j=1;j<=d;j++) jours.push({j, v: totalAt(iso(y,m,j))});
  const total = comptes.reduce((s,c)=>s+c.solde,0);
  const M = {maj:new Date(CACHE.lastSync), comptes, total, mois, jours};

  // Soldes de tous les comptes (y compris non inclus) pour les poches
  const accBal = balAt;
  const accNom = id => (CACHE.accounts.find(a=>a.id===id)||{}).name || '—';
  const todayIso = iso(y,m,d);

  const cartes = (CFG.cartes||[]).filter(c=>c.compte);
  if(cartes.length){
    const debut = iso(y,m,1);
    M.cartes = cartes.map(c=>{
      const f = (c.filtre||'').trim().toLowerCase();
      const dep = allRecs.filter(r=> r[0]===c.compte && r[1]>=debut && r[1]<=todayIso && r[3]==='expense' && !r[4]
                    && (!f || (r[5]||'').includes(f))).reduce((s,r)=>s-r[2],0);
      return {nom:esc(c.nom||'Carte'), depense:dep, budget:Number(c.budget)||0};
    });
  }

  const prets = (CFG.prets||[]).filter(p=>p.debut && p.fin && Number(p.mensualite));
  if(prets.length){
    const nbMois = (a,b) => (b.getFullYear()-a.getFullYear())*12 + (b.getMonth()-a.getMonth()) + (b.getDate()>=a.getDate()?1:0);
    M.prets = prets.map(p=>{
      const deb=new Date(p.debut), fin=new Date(p.fin), mens=Number(p.mensualite);
      const n = Math.max(nbMois(deb,fin),1), faites = Math.min(Math.max(nbMois(deb,now),0), n);
      return {nom:esc(p.nom||'Prêt'), rembourse:mens*faites, total:mens*n, fin:p.fin};
    });
  }

  const poches = (CFG.poches||[]).filter(p=>p.compte);
  if(poches.length){
    M.poches = poches.map(p=>{
      const hist=[]; for(let k=11;k>=1;k--) hist.push(accBal(p.compte, iso(y,m-k+1,0)));
      hist.push(accBal(p.compte, todayIso));
      return {nom:esc(p.nom||'Poche'), compte:esc(accNom(p.compte)), solde:hist[11],
              cible:Number(p.cible)||0, echeance:p.echeance?Number(p.echeance):null, graphe:!!p.graphe, historique:hist};
    });
  }
  return M;
}

/* ------------------------------------------------------------------
   AFFICHAGE
   ------------------------------------------------------------------ */
function render(){
  const F = fakeData();
  const real = !!(CFG.token && CACHE && CACHE.accounts);
  const R = real ? realModel() : {};
  const D = {...F, ...R};
  const exIf = k => (real && !R[k]) ? ex : '';
  const ex = '<span class="tagmini">exemple</span>';
  document.getElementById('fakeTag').style.display = real ? 'none' : '';
  document.getElementById('maj').textContent =
    'Mis à jour le '+D.maj.toLocaleDateString('fr-FR')+' à '+D.maj.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});

  const mob = D.comptes.filter(c=>c.mobilisable);
  const mobil = mob.reduce((s,c)=>s+c.solde,0);
  const mobNoms = real ? mob.map(c=>esc(c.nom)).join(' + ') : 'Livret A + LDD + comptes courants';
  document.getElementById('richesse').innerHTML = `
    <h2>Richesse totale</h2>
    <div class="big num">${eur(D.total)}</div>
    <div class="sub num">dont mobilisable <b>${eur(mobil)}</b> (${mobNoms})</div>
    ${richesseChart(D)}`;

  const dep = D.cartes.reduce((s,c)=>s+c.depense,0), bud = D.cartes.reduce((s,c)=>s+c.budget,0);
  document.getElementById('depenses').innerHTML = `
    <h2>Dépenses du mois en cours${exIf('cartes')}</h2>
    <div class="big num">${eur(dep)}</div>
    <div class="sub num">soit <b>${pct(dep,bud)} %</b> de la cible (${eur(bud)})</div>
    ${D.cartes.map(c=>`
      <div class="row">
        <div class="lbl num"><span>${c.nom}</span><span>${eur(c.depense)} / ${eur(c.budget)} · ${pct(c.depense,c.budget)} %</span></div>
        ${bar(c.depense,c.budget)}
      </div>`).join('')}`;

  document.getElementById('objectifs').innerHTML = `
    <h2>Atteinte des objectifs${exIf('prets')}</h2>
    ${D.prets.map(p=>`
      <div class="row">
        <div class="lbl num"><span><b>${pct(p.rembourse,p.total)} %</b> ${p.nom.toLowerCase()}</span><span>${eur(p.rembourse)} / ${eur(p.total)}</span></div>
        ${bar(p.rembourse,p.total)}
        <div class="hint">Fin le ${dateLongue(p.fin)}</div>
      </div>`).join('')}`;

  // Poches : format unifié (exemple converti si non configuré)
  const P = R.poches || [
    {...F.poches.precaution, graphe:true},
    ...F.poches.autres,
    {...F.poches.retraite, cible:F.poches.retraite.objectif, graphe:true},
  ];
  const pocheHtml = x => {
    const avecEch = x.cible && x.echeance;
    const v = x.cible && !x.echeance ? `${pct(x.solde,x.cible)} %` : eur(x.solde);
    const c = x.cible && !x.echeance ? `${eur(x.solde)} / ${eur(x.cible)} cible · ${x.compte}`
            : avecEch ? `objectif ${eur(x.cible)} en ${x.echeance} · ${x.compte}` : x.compte;
    return x.graphe
      ? `<div class="pocket wide"><div><div class="n">${x.nom}</div><div class="v num">${v}</div><div class="c num">${c}</div></div>${spark(x.historique)}</div>`
      : `<div class="pocket"><div class="n">${x.nom}</div><div class="v num">${v}</div><div class="c num">${c}</div></div>`;
  };
  document.getElementById('epargne').innerHTML = `
    <h2>Épargne${exIf('poches')}</h2>
    <div class="pockets">${P.map(pocheHtml).join('')}</div>`;
}

/* ------------------------------------------------------------------
   RÉGLAGES
   ------------------------------------------------------------------ */
function renderAccList(){
  const box=document.getElementById('accList');
  if(!CACHE || !CACHE.accounts){ box.innerHTML=''; return; }
  box.innerHTML = `<label>Comptes Wallet</label><div class="acc"><span class="h">Compte</span><span class="h" style="text-align:right">Solde calculé</span><span class="h">Inclus</span><span class="h">Mobilisable</span>
    ${CACHE.accounts.map(a=>{ const c=accCfg(a);
      const solde = soldeActuel(a);
      return `
      <span>${esc(a.name)}</span>
      <span class="num" style="text-align:right;white-space:nowrap">${eur(solde)}</span>
      <input type="checkbox" data-id="${esc(a.id)}" data-k="inclus" ${c.inclus?'checked':''} aria-label="Inclure ${esc(a.name)}">
      <input type="checkbox" data-id="${esc(a.id)}" data-k="mobilisable" ${c.mobilisable?'checked':''} aria-label="${esc(a.name)} mobilisable">`; }).join('')}</div>`;
}

const EDITORS = {
  cartes:{titre:'Cartes (dépenses du mois)', champs:[
    ['nom','Nom','text'],['compte','Compte','account'],['filtre','Mot-clé dans le libellé (facultatif)','text'],['budget','Budget mensuel (€)','number']]},
  prets:{titre:'Prêts', champs:[
    ['nom','Nom','text'],['mensualite','Mensualité (€)','number'],['debut','1re échéance','date'],['fin','Dernière échéance','date']]},
  poches:{titre:'Poches (une poche = un compte)', champs:[
    ['nom','Nom','text'],['compte','Compte','account'],['cible','Cible ou objectif (€, facultatif)','number'],
    ['echeance','Année objectif (facultatif)','number'],['graphe','Graphe mensuel','check']]},
};
function renderEditors(){
  const box=document.getElementById('editors');
  if(!CACHE || !CACHE.accounts){ box.innerHTML=''; return; }
  const opts = sel => '<option value="">—</option>'+CACHE.accounts.map(a=>`<option value="${esc(a.id)}" ${a.id===sel?'selected':''}>${esc(a.name)}</option>`).join('');
  box.innerHTML = Object.entries(EDITORS).map(([k,E])=>`
    <div class="ed"><h4>${E.titre}</h4>
      ${(CFG[k]||[]).map((it,i)=>`<div class="item">
        ${E.champs.map(([f,lab,t])=>{
          const a=`data-l="${k}" data-i="${i}" data-f="${f}"`, v=esc(it[f]??'');
          const inp = t==='account' ? `<select ${a}>${opts(it[f])}</select>`
                    : t==='check' ? `<input type="checkbox" ${a} ${it[f]?'checked':''}>`
                    : `<input type="${t}" ${a} value="${v}" ${t==='number'?'inputmode="decimal" step="any"':''}>`;
          return `<div><label>${lab}</label>${inp}</div>`; }).join('')}
        <button class="del" data-del="${k}" data-i="${i}">Supprimer</button></div>`).join('')}
      <div class="acts"><button data-add="${k}">Ajouter</button></div></div>`).join('');
}

async function doSync(full){
  if(!CFG.token){ render(); return; }
  setStatus('Synchronisation…');
  try{ await sync(full); setStatus(''); }
  catch(e){ setStatus(e.message); }
  render(); renderAccList(); renderEditors();
}

{
  const $=id=>document.getElementById(id);
  $('refresh').addEventListener('click', ()=>doSync(false));
  $('openSettings').addEventListener('click', ()=>{ $('token').value=CFG.token; $('relais').value=CFG.relais||''; renderAccList(); renderEditors(); $('settings').classList.add('open'); });
  $('closeSettings').addEventListener('click', ()=>{ $('settings').classList.remove('open'); render(); });
  $('saveToken').addEventListener('click', ()=>{ CFG.token=$('token').value.trim(); CFG.relais=$('relais').value.trim(); save(K_CFG,CFG); CACHE=null; localStorage.removeItem(K_CACHE); doSync(true); });
  $('fullSync').addEventListener('click', ()=>doSync(true));
  $('wipe').addEventListener('click', ()=>{ try{ localStorage.removeItem(K_CFG); localStorage.removeItem(K_CACHE); }catch(e){}
    CFG={token:'',accounts:{}}; CACHE=null; $('token').value=''; $('relais').value=''; renderAccList(); renderEditors(); setStatus(''); render(); });
  $('editors').addEventListener('change', e=>{
    const t=e.target, k=t.dataset.l; if(!k) return;
    CFG[k][+t.dataset.i][t.dataset.f] = t.type==='checkbox' ? t.checked : t.value;
    save(K_CFG,CFG); render();
  });
  $('editors').addEventListener('click', e=>{
    const t=e.target;
    if(t.dataset.add){ (CFG[t.dataset.add] ||= []).push({}); }
    else if(t.dataset.del){ CFG[t.dataset.del].splice(+t.dataset.i,1); }
    else return;
    save(K_CFG,CFG); renderEditors(); render();
  });
$('copyCfg').addEventListener('click', async ()=>{
    const {token, ...rest} = CFG; const txt = JSON.stringify(rest);
    try{ await navigator.clipboard.writeText(txt); setStatus('Réglages copiés : colle-les dans les Réglages de l\'autre appareil.'); }
    catch(e){ $('cfgText').value = txt; $('cfgText').select(); setStatus('Copie automatique refusée : le texte est sélectionné dans le champ, copie-le à la main.'); }
  });
  $('importCfg').addEventListener('click', ()=>{
    try{
      const o = JSON.parse($('cfgText').value.trim());
      if(!o || typeof o!=='object' || Array.isArray(o)) throw 0;
      ['accounts','cartes','prets','poches','relais'].forEach(k=>{ if(o[k]!==undefined) CFG[k]=o[k]; });
      save(K_CFG,CFG); $('cfgText').value=''; renderAccList(); renderEditors(); render();
      setStatus('Réglages importés.');
    }catch(e){ setStatus('Texte non reconnu : recopie les réglages depuis l\'autre appareil.'); }
  });
  $('accList').addEventListener('change', e=>{
    const t=e.target; if(!t.dataset.id) return;
    CFG.accounts[t.dataset.id] = {...accCfg(CACHE.accounts.find(a=>a.id===t.dataset.id)), [t.dataset.k]: t.checked};
    save(K_CFG,CFG); render();
  });
  render();
  doSync(false);
  setInterval(()=>doSync(false), 60*60*1000); // toutes les heures
}
</script>
